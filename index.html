<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Élora</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #fff8fa;
      color: #2f2529;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 35px;
    }

    button {
      background: #e8b8c8;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 30px;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      background: #d99caf;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>MAISON ÉLORA</h1>

    <p>Elegance, made for you.</p>

    <button>SHOP NOW</button>
  </div>

</body>
</html>
