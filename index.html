<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maison Élora</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    background: #fff9fb;
    color: #33272c;
}

header {
    padding: 25px 20px;
    text-align: center;
    border-bottom: 1px solid #f0dfe5;
}

.logo {
    font-size: 27px;
    letter-spacing: 5px;
}

.tagline {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #8d747d;
}

.hero {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 25px;
}

.hero h1 {
    font-size: 45px;
    font-weight: normal;
    letter-spacing: 6px;
    margin: 0;
}

.hero p {
    font-size: 16px;
    letter-spacing: 2px;
    color: #806a72;
    margin: 18px 0 35px;
}

.shop-button {
    display: inline-block;
    background: #dcaebe;
    color: white;
    padding: 15px 40px;
    border-radius: 30px;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
}

.shop-button:hover {
    background: #c994a7;
}

section {
    padding: 45px 25px;
    text-align: center;
}

section h2 {
    font-size: 27px;
    font-weight: normal;
    letter-spacing: 3px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    max-width: 600px;
    margin: 30px auto;
}

.category {
    background: #f8e5eb;
    padding: 45px 10px;
    border-radius: 12px;
    font-size: 17px;
    letter-spacing: 1px;
}

footer {
    text-align: center;
    padding: 30px;
    font-size: 12px;
    color: #8d747d;
    border-top: 1px solid #f0dfe5;
}
</style>
</head>

<body>

<header>
    <div class="logo">MAISON ÉLORA</div>
    <div class="tagline">Elegance, made for you.</div>
</header>

<div class="hero">
    <h1>MAISON ÉLORA</h1>

    <p>Discover pieces made to feel beautiful.</p>

    <a class="shop-button" href="#shop">SHOP NOW</a>
</div>

<section id="shop">

    <h2>SHOP</h2>

    <div class="categories">

        <div class="category">
            Dresses
        </div>

        <div class="category">
            Accessories
        </div>

        <div class="category">
            New Arrivals
        </div>

        <div class="category">
            Collections
        </div>

    </div>

</section>

<footer>
    © 2026 Maison Élora
</footer>

</body>
</html>
